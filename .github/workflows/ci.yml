name: Verify RELAY
on:
  # Verification runs locally for this free-only alpha. Hosted runners are
  # opt-in so a private repository cannot silently consume paid Actions minutes.
  workflow_dispatch:
    inputs:
      platform:
        description: Verification platform
        type: choice
        default: desktop
        options: [desktop, macos]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'macos' && '["macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - if: runner.os == 'macOS'
        run: node -p 'JSON.stringify({platform:process.platform,arch:process.arch,node:process.version})'
      - run: npm run check
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: npm run test:cloud
      - if: runner.os == 'Linux'
        run: npm run test:portal
      - if: runner.os == 'macOS'
        run: npx playwright install chromium
      - if: runner.os == 'macOS'
        run: npm run test:desktop
      - if: runner.os == 'macOS'
        run: npm run test:collaboration
      - run: npm audit --omit=dev --audit-level=high

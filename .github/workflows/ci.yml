name: Verify RELAY
on:
  # Verification runs locally for this free-only alpha. Hosted runners are
  # opt-in so a private repository cannot silently consume paid Actions minutes.
  workflow_dispatch:
    inputs:
      platform:
        description: Verification platform
        type: choice
        default: desktop
        options: [desktop, macos, paired-macos, sade-eval]
      sade_suite:
        description: Sade model benchmark suite
        type: choice
        default: pilot
        options:
          [
            pilot,
            corpus,
            contrast,
            planner-constraints,
            referenced-requests,
            quota-followup,
            quota-example,
          ]
      sade_intent_prompt:
        description: Intent prompt for the full Sade corpus
        type: choice
        default: baseline
        options: [baseline, ordered]
      paired_origin:
        description: Temporary cross-host test origin for paired-macos
        type: string
        required: false
permissions:
  contents: read
jobs:
  verify:
    if: inputs.platform == 'desktop' || inputs.platform == 'macos'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'macos' && '["macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - if: runner.os == 'macOS'
        run: node -p 'JSON.stringify({platform:process.platform,arch:process.arch,node:process.version})'
      - run: npm run check
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: npm run test:cloud
      - if: runner.os == 'Linux'
        run: npm run test:portal
      - if: runner.os == 'macOS'
        run: npx playwright install chromium
      - if: runner.os == 'macOS'
        run: npm run test:desktop
      - if: runner.os == 'macOS'
        run: npm run test:collaboration
      - run: npm audit --omit=dev --audit-level=high
  paired-macos:
    if: inputs.platform == 'paired-macos'
    runs-on: macos-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Run tool-only Sade pairing fixture
        env:
          KIVUNO_CROSS_HOST_ORIGIN: ${{ inputs.paired_origin }}
          OPENAI_API_KEY: test-sentinel-not-a-credential
        run: >-
          node --import tsx --input-type=module -e
          "import { runCrossHostMac } from './tests/fixtures/shared-sade-cross-host.ts';
          await runCrossHostMac(process.env.KIVUNO_CROSS_HOST_ORIGIN)"
  sade-eval:
    if: inputs.platform == 'sade-eval' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((inputs.sade_suite == 'referenced-requests' || inputs.sade_suite == 'quota-example') && '[0]' || (inputs.sade_suite == 'contrast' || inputs.sade_suite == 'planner-constraints' || inputs.sade_suite == 'quota-followup') && '[0,1]' || '[0,1,2,3,4]') }}
    env:
      OLLAMA_HOST: 127.0.0.1:11565
      OLLAMA_NO_CLOUD: 'true'
      OLLAMA_NUM_PARALLEL: '1'
      SADE_MODEL: qwen3:4b-instruct-2507-q4_K_M
      SADE_MODEL_DIGEST: 0edcdef34593eac1aa2be9c7d06c432dcf81945adca5eca2f27662c18f168ba0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/sade-ollama
            ${{ runner.temp }}/sade-models
          key: sade-linux-cpu-ollama-0.40.16-qwen-0edcdef34593
      - name: Evaluate synthetic Shared Groups messages with local inference
        env:
          SADE_SUITE: ${{ inputs.sade_suite }}
          SADE_SHARD: ${{ matrix.shard }}
          SADE_INTENT_PROMPT: ${{ inputs.sade_intent_prompt }}
        run: |
          set -euo pipefail
          export OLLAMA_MODELS="$RUNNER_TEMP/sade-models"
          ollama="$RUNNER_TEMP/sade-ollama/bin/ollama"
          if [[ ! -x "$ollama" ]]; then
            archive="$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
            curl --fail --show-error --silent --location --retry 3 \
              https://github.com/ollama/ollama/releases/download/v0.40.16/ollama-linux-amd64.tar.zst \
              --output "$archive"
            printf '%s  %s\n' 87bfafb2acbc89b2e6a1be0a9043de6aa75fb450696f86bc426e65fc448f788d "$archive" | sha256sum -c -
            mkdir -p "$RUNNER_TEMP/sade-ollama"
            tar --zstd -xf "$archive" --exclude='*/cuda*' -C "$RUNNER_TEMP/sade-ollama"
            rm "$archive"
          fi
          "$ollama" serve >"$RUNNER_TEMP/sade-ollama.log" 2>&1 &
          ollama_pid=$!
          trap 'kill "$ollama_pid" 2>/dev/null || true; wait "$ollama_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "http://$OLLAMA_HOST/api/version" >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error "http://$OLLAMA_HOST/api/version"
          "$ollama" pull "$SADE_MODEL"
          curl --fail --silent --show-error "http://$OLLAMA_HOST/api/tags" |
            jq -e --arg model "$SADE_MODEL" --arg digest "$SADE_MODEL_DIGEST" \
              'any(.models[]; .name == $model and .digest == $digest)'
          results="$RUNNER_TEMP/sade-results"
          mkdir -p "$results"
          if [[ "$SADE_SUITE" == corpus ]]; then
            node --import tsx scripts/eval-shared-sade-local.ts --categories --model "$SADE_MODEL" \
              --intent-prompt "$SADE_INTENT_PROMPT" --shard "$SADE_SHARD/5" \
              --output "$results/corpus-$SADE_SHARD.jsonl"
          elif [[ "$SADE_SUITE" == contrast ]]; then
            prompts=(baseline ordered)
            node --import tsx scripts/eval-shared-sade-local.ts --categories --contrast --model "$SADE_MODEL" \
              --intent-prompt "${prompts[$SADE_SHARD]}" --output "$results/contrast-$SADE_SHARD.jsonl"
          elif [[ "$SADE_SUITE" == referenced-requests ]]; then
            node --import tsx scripts/eval-shared-sade-planner.ts "$results/referenced-requests.json" \
              --referenced-requests --timeout-ms 120000
          elif [[ "$SADE_SUITE" == quota-followup ]]; then
            prompts=(baseline quota-compact)
            mode="${prompts[$SADE_SHARD]}"
            node --import tsx scripts/eval-shared-sade-planner.ts "$results/quota-followup-$mode.json" \
              --quota-followup --planning-prompt "$mode" --timeout-ms 180000
          elif [[ "$SADE_SUITE" == quota-example ]]; then
            node --import tsx scripts/eval-shared-sade-planner.ts "$results/quota-followup-quota-example.json" \
              --quota-followup --planning-prompt quota-example --timeout-ms 180000
          elif [[ "$SADE_SUITE" == planner-constraints ]]; then
            if [[ "$SADE_SHARD" == 0 ]]; then
              node --import tsx scripts/eval-shared-sade-planner.ts "$results/quota.json" \
                --quota-fallback --planning-prompt constraints --timeout-ms 120000
            else
              node --import tsx scripts/eval-shared-sade-planner.ts "$results/paired-mac.json" \
                --case mac/2 --planning-prompt constraints --timeout-ms 120000
            fi
          elif [[ "$SADE_SHARD" == 0 ]]; then
            node --import tsx scripts/eval-shared-sade-planner.ts "$results/quota.json" \
              --quota-fallback --timeout-ms 120000
          elif [[ "$SADE_SHARD" == 4 ]]; then
            node --import tsx scripts/eval-shared-sade-local.ts --categories --model "$SADE_MODEL" \
              --sample --limit 40 --output "$results/pilot.jsonl"
          else
            node --import tsx scripts/eval-shared-sade-planner.ts "$results/planner-$SADE_SHARD.json" \
              --shard "$((SADE_SHARD - 1))/3" --timeout-ms 120000
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sade-${{ inputs.sade_suite }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/sade-results/*
          retention-days: 7

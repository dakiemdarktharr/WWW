name: Verify RELAY
on:
  # Verification runs locally for this free-only alpha. Hosted runners are
  # opt-in so a private repository cannot silently consume paid Actions minutes.
  workflow_dispatch:
    inputs:
      platform:
        description: Verification platform
        type: choice
        default: desktop
        options: [desktop, macos, paired-macos]
      paired_origin:
        description: Temporary cross-host test origin for paired-macos
        type: string
        required: false
permissions:
  contents: read
jobs:
  verify:
    if: inputs.platform != 'paired-macos'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'macos' && '["macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - if: runner.os == 'macOS'
        run: node -p 'JSON.stringify({platform:process.platform,arch:process.arch,node:process.version})'
      - run: npm run check
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: npm run test:cloud
      - if: runner.os == 'Linux'
        run: npm run test:portal
      - if: runner.os == 'macOS'
        run: npx playwright install chromium
      - if: runner.os == 'macOS'
        run: npm run test:desktop
      - if: runner.os == 'macOS'
        run: npm run test:collaboration
      - run: npm audit --omit=dev --audit-level=high
  paired-macos:
    if: inputs.platform == 'paired-macos'
    runs-on: macos-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Run tool-only Sade pairing fixture
        env:
          KIVUNO_CROSS_HOST_ORIGIN: ${{ inputs.paired_origin }}
          OPENAI_API_KEY: test-sentinel-not-a-credential
        run: >-
          node --import tsx --input-type=module -e
          "import { runCrossHostMac } from './tests/fixtures/shared-sade-cross-host.ts';
          await runCrossHostMac(process.env.KIVUNO_CROSS_HOST_ORIGIN)"

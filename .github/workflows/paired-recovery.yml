name: Paired check recovery
on: workflow_dispatch
permissions:
  contents: read

jobs:
  coordinator:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 18
    permissions:
      contents: read
      actions: write # Dispatch the existing tool-only macOS job on this revision.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install chromium
      - name: Run Windows Reviews with a paired Mac
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          KIVUNO_PAIRED_RECOVERY: '1'
          KIVUNO_CROSS_HOST_PORT: '58174'
          KIVUNO_RECOVERY_EVIDENCE_DIR: ${{ runner.temp }}/recovery-evidence
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'kivuno-fixture-cloudflared.exe'
          $log = Join-Path $env:RUNNER_TEMP 'kivuno-fixture-tunnel.log'
          Invoke-WebRequest 'https://github.com/cloudflare/cloudflared/releases/download/2026.11.1/cloudflared-windows-amd64.exe' -OutFile $bin
          if ((Get-FileHash -LiteralPath $bin).Hash -ne '341deda3db5ec498a0482254d6c38c0b7cf01a30c37bb5dd95d2216d08955e35') { throw 'Unexpected tunnel binary digest' }
          if (Get-NetTCPConnection -LocalPort 58174 -State Listen -ErrorAction SilentlyContinue) { throw 'Test bridge port already in use' }
          $tunnel = Start-Process -FilePath $bin -WindowStyle Hidden -PassThru -RedirectStandardError $log -ArgumentList @('tunnel','--no-autoupdate','--protocol','http2','--url','http://127.0.0.1:58174')
          try {
            $deadline = (Get-Date).AddSeconds(90)
            do {
              Start-Sleep -Seconds 1
              $diagnostic = [string](Get-Content -LiteralPath $log -Raw)
              $origin = [regex]::Match($diagnostic, 'https://[a-z0-9-]+\.trycloudflare\.com').Value
              $registered = $diagnostic -match 'Registered tunnel connection'
            } until (($origin -and $registered) -or $tunnel.HasExited -or (Get-Date) -gt $deadline)
            if (!$origin -or !$registered) { throw 'Fixture tunnel failed to register a connection' }
            $env:KIVUNO_CROSS_HOST_ORIGIN = $origin
            $env:KIVUNO_MAC_WORKFLOW_REF = "$env:GITHUB_REPOSITORY/.github/workflows/ci.yml@$env:GITHUB_REF"
            $macRun = gh workflow run ci.yml --ref main -f platform=paired-macos -f "paired_origin=$origin"
            if ($LASTEXITCODE -or $macRun -notmatch '/actions/runs/(\d+)') { throw 'Could not identify the dispatched Mac run' }
            $env:KIVUNO_MAC_RUN_ID = $Matches[1]
            "Paired Mac run: $macRun" >> $env:GITHUB_STEP_SUMMARY
            Remove-Item Env:\GH_TOKEN
            node --import tsx --test --test-name-pattern "Windows Reviews recovers" tests/machine-execution.test.ts
            if ($LASTEXITCODE) { throw 'Cross-host check failed' }
          } finally {
            if (!$tunnel.HasExited) { $tunnel.Kill() }
            Get-Content -LiteralPath $log -Tail 12
          }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: recovery-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-evidence/
          if-no-files-found: ignore
          retention-days: 30

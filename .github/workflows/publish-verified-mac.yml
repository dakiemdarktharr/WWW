name: Publish verified macOS package
on:
  workflow_dispatch:
  push:
    branches: [codex/billing-activation-release-0913]
    paths: [.github/workflows/publish-verified-mac.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify successful pinned build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..60}; do
            gh api repos/${{ github.repository }}/actions/runs/44924449349 > run.json
            if [ "$(jq -r .status run.json)" = completed ]; then break; fi
            sleep 10
          done
          test "$(jq -r .conclusion run.json)" = success
          test "$(jq -r .head_sha run.json)" = b185de975cdb456504eaccfc8d3eae0178c02313
      - name: Download verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 44924449349 --repo ${{ github.repository }} --name kivuno-macos-arm64 --dir packages
      - name: Publish staged package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd packages
          sha256sum -c Kivuno-0.9.13-macOS-arm64.dmg.sha256
          sha256sum -c Kivuno-0.9.13-macOS-arm64.zip.sha256
          gh release upload v0.9.13-macos-r2 --repo ${{ github.repository }} Kivuno-0.9.13-macOS-arm64.dmg Kivuno-0.9.13-macOS-arm64.dmg.sha256 Kivuno-0.9.13-macOS-arm64.zip Kivuno-0.9.13-macOS-arm64.zip.sha256 macos-arm64.json
